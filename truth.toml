added = 3816
removed = 87
established = "2026-08-04"    # пункты 1-16, ручное ревью
extended = "2026-08-20"       # пункты 17-31, разбор выхлопа muse-glimmer
note = """
Осторожно при сравнении моделей: пункты 1-16 собраны независимо от прогонов,
пункты 17-31 — из выхлопа muse-glimmer, проверенного по коду. Модель, породившая
половину эталона, имеет на ней преимущество; честное сравнение моделей — только
по пунктам 1-16 (`origin = "manual"`).
"""

