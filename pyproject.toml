[project]
name = "roboviewer"
version = "0.2.0"
description = "A local, agent-driven automated reviewer for merge requests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["code-review", "llm", "agents", "git", "merge-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
# Pinned exactly, not by lower bound. A floating range meant CI installed
# whatever had been published that morning: openai 3.0 dropped httpx, which
# nothing here declared, and every branch went red at once for a reason none of
# them contained. These are the versions the checks were last run against, and
# moving one is an edit somebody makes and measures.
#
# What this does not pin is everything these pull in — anyio, httpcore, certifi
# and the rest float, so the same class of surprise can still arrive one level
# down. Closing that needs a lock file, which is a bigger decision than this.
dependencies = [
    # Imported directly by diagnose.py and by the rate-limit tests, and until
    # openai 3.0 it was only ever installed as a dependency of that.
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    # Held at 2.x on purpose. Nothing in the suite drives a real provider, and
    # the SDK is reached from one module, so a green pipeline on 3.0 would not
    # be evidence that a review still runs. Lift it after driving one.
    "openai==2.54.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "complexipy==7.0.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[project.scripts]
roboviewer = "roboviewer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roboviewer*"]

[tool.setuptools.package-data]
roboviewer = ["checklists/**/*.md", "prompts/**/*.md", "templates/**/*.j2", "templates/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # syntax the minimum version already allows
    "B", "BLE",      # bugbear, blind excepts — the noqa comments already in the code
    "SIM", "RET", "C4",
    "ARG",           # unused arguments
    "RUF",
    "C901",                    # cyclomatic complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # returns, branches, arguments, statements
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
# Six, not pylint's default five. The recurring shape here is three arguments
# naming the work and up to three keyword-only knobs the caller reads out of
# the config; bundling one of those knobs into an object to satisfy five hides
# what the call does. Nine is a different matter — see gitdiff.DiffBudget.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Fixtures assemble models by hand, and the Cyrillic in them is the point: those
# tests check what the tool does with output in another language.
"tests/*" = ["ARG001", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
# `corpus` is not part of the wheel — it builds the measurement corpus beside
# the tool — but it is held to the same types as the tool it measures.
files = ["roboviewer", "corpus"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
