# Copy to .roboviewer/config.toml inside the reviewed repository,
# or to ~/.config/roboviewer/config.toml.

[provider]
# OpenAI-compatible endpoint of the custom provider
base_url = "https://your-gateway.example.com/v1"
# By default the key comes from an environment variable
api_key_env = "ROBOVIEWER_API_KEY"
# ...or is set right here, which takes precedence over the variable.
# Handy while debugging; make sure a file holding the key never reaches git.
# api_key = "sk-..."
model = "your-model-name"
# The judge may be a stronger model; defaults to the same `model`
# judge_model = "your-stronger-model"
temperature = 0.1
max_tokens = 8000
timeout_s = 300
max_retries = 3
# Set to false if the gateway cannot handle several tool_calls in one response
parallel_tool_calls = true

# Reasoning ("thinking") tokens, for models that emit them. Unset leaves the
# model on its own default; false sends chat_template_kwargs.enable_thinking =
# false, which Qwen-style chat templates understand and which leaves tool calling
# working.
#
# Thinking is decoded one token at a time and is usually the largest term in how
# long a run takes — the context block resent on every turn comes back from the
# provider's prefix cache. Switching it off trades review depth for speed by an
# amount that depends on the model, so it is worth running both ways against a
# merge request whose problems are already known.
# `--thinking on|off` overrides this for a single run.
# enable_thinking = false
# The judge checks stated claims against the code rather than looking for them.
# Defaults to `enable_thinking`.
# judge_enable_thinking = false

# Provider-specific request fields the OpenAI SDK has no parameter for, sent in
# the body as-is. Gateways tend to accept unknown fields in silence, so check
# that the model reacts to one before relying on it.
# [provider.extra_body]
# top_k = 20

# How to pass the key. Defaults to the OpenAI way: Authorization: Bearer <key>.
# Valid key + valid address but still 401 — almost always this.
#   auth_header = "api-key"    + auth_scheme = ""      → api-key: <key>
#   auth_header = "X-Api-Key"  + auth_scheme = ""      → X-Api-Key: <key>
#   auth_scheme = "Token"                              → Authorization: Token <key>
# When auth_header is not Authorization, the built-in Bearer header is not sent at all.
auth_header = "Authorization"
auth_scheme = "Bearer"

# How the agent is pushed to submit its result on the final turn.
#   "forced"   — tool_choice = {"type": "function", ...}, names the exact tool
#   "required" — tool_choice = "required", any tool but at least one
#   "auto"     — no pressure; relies on the plain-text JSON fallback
# Lower it only if `roboviewer --check-provider` reports the gateway rejects the
# stronger mode — it prints the recommended value.
terminal_tool_choice = "forced"

# Extra headers, if the gateway requires them
# [provider.extra_headers]
# X-Project = "roboviewer"

[run]
# Branches are not configurable: the target is a CLI argument, the source defaults
# to the current branch.
#   roboviewer develop
#   roboviewer develop feature/login
checklist_dir = "checklists/default"
# Каталог с промптами. Пусто — комплектные тексты, плюс .roboviewer/prompts/
# внутри проверяемого репозитория, если он там есть. В своём наборе достаточно
# тех файлов, которые вы правите: остальные берутся из комплекта.
# Список файлов и плейсхолдеров — roboviewer/prompts/default/README.md
prompts_dir = ""
# Каталог с шаблонами отчёта — резолвится так же, как prompts_dir: пусто значит
# комплектные, плюс .roboviewer/templates/ внутри проверяемого репозитория.
# Поля, фильтры и соглашения — roboviewer/templates/default/README.md
templates_dir = ""
# Какие отчёты писать. Здесь имена шаблонов, а не форматов: свой шаблон из
# templates_dir перечисляется как есть, имя файла получается отбрасыванием .j2.
# Переопределяется флагом --format md,html
report_templates = ["report.md.j2"]
# A relative path lands inside the reviewed repository.
# An absolute one lands outside, nested by repository name; overridden by -o/--output
# and by ROBOVIEWER_OUTPUT.
output_dir = ".roboviewer/runs"
# How many checklist items are reviewed at the same time — concurrent requests to
# the model, not OS threads. The judge runs afterwards, on its own.
concurrency = 4
# Cap on agent turns (tool calls) per checklist item
max_turns = 25
# Changed files go to the agent in full, with changed lines marked up.
# A file longer than inline_max_lines falls back to hunks — the agent reads the
# rest via read_file.
inline_max_lines = 600
# Overall cap on inlined files. The budget goes to the most heavily changed ones.
inline_max_total_chars = 400000
# Hunk context for files that were not inlined in full
diff_context_lines = 12
diff_max_chars = 300000
min_confidence = 0.0
enable_judge = true
max_read_lines = 800

# Files kept out of the review entirely. Defaults are stack-agnostic: lockfiles,
# generated code, vendored dependencies, snapshots.
#
# NOTE: this list REPLACES the defaults, it does not extend them. If you set it,
# copy over whatever you still want from the block below.
exclude_globs = [
    "*.lock",
    "**/*.generated.*",
    "**/generated/**",
    "**/node_modules/**",
    "**/vendor/**",
    "**/*.snap",
    "**/__snapshots__/**",
    # Our own reports — keep these, or a run will end up reviewing its own output
    ".roboviewer/**",
    "**/.roboviewer/**",
]

# Ready-made additions per stack — append the ones that match your project.
#
# iOS / Swift:
#     "*.pbxproj",
#     "*.xcworkspacedata",
#     "*.strings",
#     "**/Package.resolved",
#     "**/*Sourcery.swift",
#     "**/Pods/**",
#
# Android / Kotlin:
#     "**/build/**",
#     "**/*.pro",
#     "**/gradle/wrapper/**",
#
# JS / TypeScript:
#     "**/dist/**",
#     "**/*.min.js",
#     "**/*.d.ts",
#
# Python:
#     "**/migrations/**",
#     "**/*_pb2.py",
#
# Go:
#     "**/*.pb.go",
#     "**/mock_*.go",
