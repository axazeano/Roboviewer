# The merge requests the benchmark reviews: one [[entry]] per pull request.
#
# Public pull requests whose review found real defects, chosen against the
# criteria in docs/benchmark-selection.md. `head` is the commit reviewers were
# looking at — not the merged one, where what they found is already fixed.
#
#   benchmark list add <url>   appends an entry and clones it
#   benchmark fetch            clones whatever is listed and not on disk
#   benchmark run              reviews every entry with roboviewer
#
# `id`, `url`, `base` and `head` are read by the fetcher. Everything else is
# read by people deciding whether an entry still earns its place.

