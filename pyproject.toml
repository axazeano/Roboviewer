[project]
name = "roboviewer"
version = "0.1.0"
description = "A local, agent-driven automated reviewer for merge requests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["code-review", "llm", "agents", "git", "merge-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "complexipy>=6.2",
    "mypy>=2.3",
    "pytest>=8.0",
    "ruff>=0.16",
]

[project.scripts]
roboviewer = "roboviewer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roboviewer*"]

[tool.setuptools.package-data]
roboviewer = ["checklists/**/*.md", "prompts/**/*.md", "templates/**/*.j2", "templates/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # syntax the minimum version already allows
    "B", "BLE",      # bugbear, blind excepts — the noqa comments already in the code
    "SIM", "RET", "C4",
    "ARG",           # unused arguments
    "RUF",
    "C901",                    # cyclomatic complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # returns, branches, arguments, statements
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
# Six, not pylint's default five. The recurring shape here is three arguments
# naming the work and up to three keyword-only knobs the caller reads out of
# the config; bundling one of those knobs into an object to satisfy five hides
# what the call does. Nine is a different matter — see gitdiff.DiffBudget.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Fixtures assemble models by hand, and the Cyrillic in them is the point: those
# tests check what the tool does with output in another language.
"tests/*" = ["ARG001", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["roboviewer"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
