# Установленная вручную истина для одного merge request.
#
# Формат: [[expected]] — дефект, который ревью обязано найти; [[forbidden]] —
# утверждение, которое ревью выдавало и которое проверено как ложное.
# Обе стороны нужны: без forbidden высокий recall можно набрать шумом.
#
# Как ставится истина: каждый пункт проверен по коду на указанном коммите и
# несёт в `evidence` то, чем именно проверен. Пункт без evidence не истина,
# а мнение — такие сюда не попадают.

