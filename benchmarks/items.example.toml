# The index of the benchmark: one [[entry]] per pull request.
#
# This is the shape of the file, not the index itself — the SHAs below are
# placeholders and no repository has them, so fetching this file fails on
# purpose. The real index is benchmarks/items.toml, chosen against the criteria
# in docs/benchmark-selection.md; this one is here so the format has somewhere
# to live with every field explained. `benchmark list add <url>` writes entries
# of this shape.
#
# See docs/benchmark.md for what each field is for and how a rebuild works.

[[entry]]
# Names the clone under benchmarks/repos/. Keep it stable: renaming it
# rebuilds the entry from scratch.
id = "requests-6800"
url = "https://github.com/psf/requests/pull/6800"

# The two commits the review is run between. Full SHAs, because a branch name
# moves and a short SHA is ambiguous — and `head` is the commit reviewers were
# looking at, not the merged result, where everything they found is already
# fixed.
base = "1111111111111111111111111111111111111111"
head = "2222222222222222222222222222222222222222"

# Everything below is read by people rather than by the fetcher: it is how a
# later reader judges whether an entry earns its place, and how the index is
# checked for leaning towards one language, one domain or one size.
language = "Python"
domain = "HTTP client library"
found = "Retries reused a consumed request body, so the second attempt sent nothing."
license = "Apache-2.0"
files = 3
added = 74
removed = 12

