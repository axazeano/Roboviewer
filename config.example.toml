# Copy to ~/.config/roboviewer/config.toml — the one file a run reads on its
# own. Keep it anywhere else and name it with --config, which reads that file
# instead of this one rather than in addition to it.

[provider]
# OpenAI-compatible endpoint of the custom provider
base_url = "https://your-gateway.example.com/v1"
# By default the key comes from an environment variable
api_key_env = "ROBOVIEWER_API_KEY"
# ...or is set right here, which takes precedence over the variable.
# Handy while debugging; make sure a file holding the key never reaches git.
# api_key = "sk-..."
model = "your-model-name"
# The judge may be a stronger model; defaults to the same `model`
# judge_model = "your-stronger-model"
temperature = 0.1
max_tokens = 8000
timeout_s = 300
max_retries = 3
# Set to false if the gateway cannot handle several tool_calls in one response
parallel_tool_calls = true

# Reasoning ("thinking") tokens, for models that emit them. Unset leaves the
# model on its own default; false sends chat_template_kwargs.enable_thinking =
# false, which Qwen-style chat templates understand and which leaves tool calling
# working.
#
# Thinking is decoded one token at a time and is usually the largest term in how
# long a run takes — the context block resent on every turn comes back from the
# provider's prefix cache. Switching it off trades review depth for speed by an
# amount that depends on the model, so it is worth running both ways against a
# merge request whose problems are already known.
# `--thinking on|off` overrides this for a single run.
# enable_thinking = false
# The judge checks stated claims against the code rather than looking for them.
# Defaults to `enable_thinking`.
# judge_enable_thinking = false

# Provider-specific request fields the OpenAI SDK has no parameter for, sent in
# the body as-is. Gateways tend to accept unknown fields in silence, so check
# that the model reacts to one before relying on it.
# [provider.extra_body]
# top_k = 20

# How to pass the key. Defaults to the OpenAI way: Authorization: Bearer <key>.
# Valid key + valid address but still 401 — almost always this.
#   auth_header = "api-key"    + auth_scheme = ""      → api-key: <key>
#   auth_header = "X-Api-Key"  + auth_scheme = ""      → X-Api-Key: <key>
#   auth_scheme = "Token"                              → Authorization: Token <key>
# When auth_header is not Authorization, the built-in Bearer header is not sent at all.
auth_header = "Authorization"
auth_scheme = "Bearer"

# How the agent is pushed to submit its result on the final turn.
#   "forced"   — tool_choice = {"type": "function", ...}, names the exact tool
#   "required" — tool_choice = "required", any tool but at least one
#   "auto"     — no pressure; relies on the plain-text JSON fallback
# Lower it only if `roboviewer --check-provider` reports the gateway rejects the
# stronger mode — it prints the recommended value.
terminal_tool_choice = "forced"

# Extra headers, if the gateway requires them
# [provider.extra_headers]
# X-Project = "roboviewer"

[run]
# Branches are not configurable: the target is a CLI argument, the source defaults
# to the current branch.
#   roboviewer develop
#   roboviewer develop feature/login
checklist_dir = "checklists/default"
# Prompt directory. Empty means the bundled texts, plus .roboviewer/prompts/
# inside the reviewed repository if it exists. A custom set need only carry the
# files you edit; the rest come from the bundle.
# Files and placeholders are listed in roboviewer/prompts/default/README.md
prompts_dir = ""
# Report template directory, resolved the same way as prompts_dir: empty means
# the bundled set, plus .roboviewer/templates/ inside the reviewed repository.
# Fields, filters and conventions: roboviewer/templates/default/README.md
templates_dir = ""
# Which reports to write. A format is a module in roboviewer/renders/, one file
# per format. Bundled:
#   md           the report for humans
#   html         the same as one self-contained file
#   sarif        SARIF 2.1.0 — GitHub Code Scanning, VS Code, Sonar
#   codequality  the Code Quality widget in a GitLab merge request
# A custom templated format is added with a report.<name>.j2 file in
# templates_dir, no Python involved. Overridden by --format md,html
report_formats = ["md"]
# Language the model writes its own text in: finding titles, rationales,
# suggestions, verdict reasons, the judge's summary. Empty asks for nothing, so
# the model answers in the language of the prompts (English by default).
# Takes an ISO code or a name — "ru", "Russian", "German"; anything unrecognised
# is written into the prompt as-is, so "Bahasa Indonesia" works too.
# Report headings and labels are not affected: those come from the templates.
# Overridden by --language.
# output_language = "ru"
# A relative path lands inside the reviewed repository.
# An absolute one lands outside, nested by repository name; overridden by -o/--output
# and by ROBOVIEWER_OUTPUT.
output_dir = ".roboviewer/runs"
# How many checklist items are reviewed at the same time — concurrent requests to
# the model, not OS threads. The judge runs afterwards, on its own.
concurrency = 4
# Cap on agent turns (tool calls) per checklist item
max_turns = 25
# Changed files go to the agent in full, with changed lines marked up.
# A file longer than inline_max_lines falls back to hunks — the agent reads the
# rest via read_file.
inline_max_lines = 600
# Overall cap on inlined files. The budget goes to the most heavily changed ones.
inline_max_total_chars = 400000
# Hunk context for files that were not inlined in full
diff_context_lines = 12
diff_max_chars = 300000
min_confidence = 0.0
# Before the review starts, search the tree once for references this diff
# introduces that resolve to nothing: symbols with no declaration, storyboards
# named but never added, localization keys with no entry, outlets no nib
# connects, source files no build manifest mentions. The result goes into the
# shared context, so it costs one prefix instead of a lookup per agent.
#
# It reads the files exclude_globs drops — a 539 KB pbxproj is the wrong thing
# to show a model and the right thing to search. Resource rules are Xcode/Swift
# specific and live in roboviewer/resolve.py; the symbol census is not.
resolve_references = true
# Keep only findings that point at what this MR changed. Reviewers get changed
# files in full — that is what stops them reporting handling that already exists
# further up — and the price is a pull towards reviewing the untouched rest of
# the file. Measured on a 64-file MR: eleven of fifteen confirmed findings sat on
# lines the branch never touched, and the author read the report as noise.
# Line arithmetic, so it holds for any language. What it sets aside is listed in
# the report under "Outside the changed lines", never silently dropped.
enforce_scope = true
# How far from a changed line a finding may sit and still count as being about
# the change: reaches the declaration above an edit and the neighbour of a
# deleted block. Raise it to let more of the surrounding file back in.
scope_margin = 5
enable_judge = true
# How findings get verified. Overridden by --judge-mode.
#   "batch"     — one pass rules on the whole list. Cheap, and the judge sees
#                 every finding at once, so it catches duplicates naturally.
#   "two_stage" — a separate pass per finding, then one pass over what survived.
#                 Each claim gets a whole turn budget, and a pass that fails
#                 costs one verdict rather than every verdict. Severity is
#                 comparative and a pass holding one claim has no scale, so the
#                 second pass calibrates the set, collapses repetition and writes
#                 the verdict on the MR. Costs N + 1 passes.
judge_mode = "batch"
# Turn budget for one judging pass; 0 follows max_turns. Worth lowering in
# two_stage mode, where the first stage gives each pass a single claim to settle.
judge_max_turns = 0
max_read_lines = 800
# Severity at which the run exits 1, so a CI job can go red on it:
#   "never"  — report and exit 0, whatever was found (the default)
#   "blocker" / "major" / "minor" / "nit" — that severity and everything worse
# Counts confirmed findings inside the changed lines only: one the judge rejected
# or one about untouched code must never fail somebody's pipeline. Exit codes are
# 0 clean, 1 gate tripped, 2 the tool could not run, 3 a checklist item failed.
# Overridden by --fail-on.
fail_on = "never"

# Files kept out of the review entirely. Defaults are stack-agnostic: lockfiles,
# generated code, vendored dependencies, snapshots.
#
# NOTE: this list REPLACES the defaults, it does not extend them. If you set it,
# copy over whatever you still want from the block below.
exclude_globs = [
    "*.lock",
    "**/*.generated.*",
    "**/generated/**",
    "**/node_modules/**",
    "**/vendor/**",
    "**/*.snap",
    "**/__snapshots__/**",
    # Our own reports — keep these, or a run will end up reviewing its own output
    ".roboviewer/**",
    "**/.roboviewer/**",
]

# Ready-made additions per stack — append the ones that match your project.
#
# iOS / Swift:
#     "*.pbxproj",
#     "*.xcworkspacedata",
#     "*.strings",
#     "**/Package.resolved",
#     "**/*Sourcery.swift",
#     "**/Pods/**",
#
# Android / Kotlin:
#     "**/build/**",
#     "**/*.pro",
#     "**/gradle/wrapper/**",
#
# JS / TypeScript:
#     "**/dist/**",
#     "**/*.min.js",
#     "**/*.d.ts",
#
# Python:
#     "**/migrations/**",
#     "**/*_pb2.py",
#
# Go:
#     "**/*.pb.go",
#     "**/mock_*.go",
