name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch with an open pull request supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is the required-status-check context. Keep it stable: adding a
  # version matrix would rename it, and the required check would stop running.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the minimum requires-python promises
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      # Each check reports even when an earlier one failed, so one run shows all
      # three verdicts. The job still fails: this reports more, not less.
      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        if: always()
        run: mypy

      - name: pytest
        if: always()
        run: pytest -q

  # Whether a gateway is configured at all. It is a job of its own because a
  # job cannot read a secret in its own `if:` — the secrets context is not
  # available there — and everything about the gateway is a secret rather than a
  # variable: an address and a model name can be somebody's corporate
  # infrastructure, and a variable is readable by anyone who can read the
  # repository. Only the answer leaves here, never the values.
  configured:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ask.outputs.ready }}
    steps:
      - id: ask
        env:
          BASE_URL: ${{ secrets.ROBOVIEWER_BASE_URL }}
          MODEL: ${{ secrets.ROBOVIEWER_MODEL }}
          KEY: ${{ secrets.ROBOVIEWER_API_KEY }}
        run: |
          if [ -n "$BASE_URL" ] && [ -n "$MODEL" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No gateway configured, so the review was skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The tool reviewing this repository's own pull requests, and posting the
  # result on them. Everything above is unit tests; this is the one job that
  # finds out whether the setup docs/ci.md describes actually works — whether
  # the gateway answers from a runner, whether GitHub accepts the review we
  # build, and whether it accepts the lines we anchor it to. None of that can be
  # learned from a test with a stubbed transport.
  #
  # The pull request of a fork reaches neither the secrets nor a token that may
  # write, so `configured` never even asks about one. This repository reviews
  # every push to a pull request, unlike what docs/ci.md advises anyone else to
  # do: here a second review on the same branch is the evidence, not the noise.
  review:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # what `roboviewer comment` posts the review with
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the branch point has to exist locally

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e .

      # A run prints `model @ host` before it starts, and GitHub hides a secret
      # only where its exact value appears — the host is a slice of the address,
      # so it would survive into a log this repository shows the world. Register
      # it as a secret of its own before anything can print it.
      - name: hide the gateway
        env:
          BASE_URL: ${{ secrets.ROBOVIEWER_BASE_URL }}
        run: |
          host=$(printf '%s' "$BASE_URL" | sed -E 's#^[a-zA-Z]+://([^/]+).*#\1#')
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi

      # Written here rather than committed: the address of a gateway is
      # somebody's infrastructure and this repository is public. Through the
      # environment, so that a quote in a value cannot rewrite the file. The key
      # reaches neither file — it arrives as ROBOVIEWER_API_KEY below.
      - name: settings
        env:
          BASE_URL: ${{ secrets.ROBOVIEWER_BASE_URL }}
          MODEL: ${{ secrets.ROBOVIEWER_MODEL }}
        run: |
          mkdir -p .roboviewer
          printf 'base_url = "%s"\napi_key_env = "ROBOVIEWER_API_KEY"\n' "$BASE_URL" \
            > .roboviewer/provider.toml
          printf '[reviewer]\nmodel = "%s"\n' "$MODEL" > .roboviewer/config.toml

      # No --fail-on: a finding about this pull request is something to read,
      # not a reason to stop it merging. The target branch is not named either —
      # it comes from GITHUB_BASE_REF, which is the path a user's job takes.
      - name: review
        run: |
          code=0
          roboviewer review --config .roboviewer/config.toml || code=$?
          # 3 is "an item failed and its aspect went unreviewed": the run is on
          # disk and worth posting. 2 is the tool not having run at all.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
        env:
          ROBOVIEWER_PROVIDER_CONFIG: .roboviewer/provider.toml
          ROBOVIEWER_API_KEY: ${{ secrets.ROBOVIEWER_API_KEY }}

      - name: comment
        run: roboviewer comment --config .roboviewer/config.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The run is deliberately not kept as an artifact: it names the model, and
      # an artifact of a public repository is downloadable by anyone. What the
      # run found is on the pull request, which is where it was going anyway.
