# ---------------------------------------------------------------------------
# False claims: the tool produced them, the judge confirmed them, verification
# refuted them. Every match with one of these in a run counts against precision,
# not towards recall.
# ---------------------------------------------------------------------------

[[forbidden]]
id = "setuppasscodeview-requires-controller"
severity_claimed = "blocker"
file = "iOSClient/Main/NCMainTabBarController.swift"
line = 154
claim = "SetupPasscodeView is created without its required controller argument — it does not compile"
why_false = """
SetupPasscodeView is a struct with no explicit init. `weak var controller: T?`
is an optional var property, and the synthesised memberwise initialiser gives
it a default of nil. The call compiles.
"""
evidence = "swiftc -typecheck on a minimal reproduction, exit 0"

[[forbidden]]
id = "mediahost-scene-identifier-wrong"
severity_claimed = "blocker"
file = "iOSClient/Media/NCMediaHost.swift"
line = 44
claim = "sceneIdentifier defaults to the storyboard's name, and instantiateViewController will hit fatalError"
why_false = "iOSClient/Media/NCMedia.storyboard has storyboardIdentifier=\"NCMedia.storyboard\". The identifier is oddly named, but it exists."
evidence = "grep -o 'storyboardIdentifier=\"[^\"]*\"' iOSClient/Media/NCMedia.storyboard"

[[forbidden]]
id = "album-name-path-traversal"
severity_claimed = "major"
file = "iOSClient/Albums/API/Albums+WebDAV.swift"
line = 163
claim = "The album name is substituted into a WebDAV path; traversal through .. or encoded separators is possible"
why_false = """
Validation strips / and \\, so .. cannot climb the tree; urlPath.encodedToUrl
percent-encodes the rest, so %2F becomes a literal.
"""
evidence = "validateAlbumName in AlbumsListViewModel.swift:77-88 and the path assembly in Albums+WebDAV.swift:163"
