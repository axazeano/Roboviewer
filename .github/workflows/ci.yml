name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch with an open pull request supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is the required-status-check context. Keep it stable: adding a
  # version matrix would rename it, and the required check would stop running.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the minimum requires-python promises
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      # Each check reports even when an earlier one failed, so one run shows all
      # three verdicts. The job still fails: this reports more, not less.
      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        if: always()
        run: mypy

      - name: pytest
        if: always()
        run: pytest -q

  # The tool reviewing this repository's own pull requests. A test with a
  # stubbed transport cannot say whether the gateway answers from a runner or
  # whether GitHub accepts the lines we anchor a review to; this can.
  #
  # Offered on every commit, run on none of them until asked: the job waits on
  # its environment, and nothing is spent until somebody approves it. The
  # concurrency above drops the waiting job of a superseded commit, so the one
  # live button always belongs to the branch as it now stands.
  #
  # The no-ai-review label, set while opening, skips the offer altogether.
  review:
    # After the linters and the tests: reviewing code that does not lint or does
    # not pass is paying a model to find what a runner already found.
    needs: checks
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'no-ai-review')
    # Holds the three secrets and waits for an approval before handing them
    # over. Nothing is spent on a pull request nobody asked to review.
    environment: model_provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # what `roboviewer comment` posts the review with
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the branch point has to exist locally

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e .

      # A run prints `model @ host`, and GitHub hides a secret only where its
      # exact value appears. The host is a slice of the address, so it needs
      # registering as a secret of its own.
      - name: hide the gateway
        env:
          BASE_URL: ${{ secrets.ROBOVIEWER_BASE_URL }}
        run: |
          host=$(printf '%s' "$BASE_URL" | sed -E 's#^[a-zA-Z]+://([^/]+).*#\1#')
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi

      # Written here rather than committed: this repository is public. Through
      # the environment, so a quote in a value cannot rewrite the file. The key
      # is in neither file; it arrives as ROBOVIEWER_API_KEY below.
      - name: settings
        env:
          BASE_URL: ${{ secrets.ROBOVIEWER_BASE_URL }}
          MODEL: ${{ secrets.ROBOVIEWER_MODEL }}
        run: |
          mkdir -p .roboviewer
          printf 'base_url = "%s"\napi_key_env = "ROBOVIEWER_API_KEY"\n' "$BASE_URL" \
            > .roboviewer/provider.toml
          # Three grouped items rather than the eight of the default set: a run
          # over this repository's own diff takes half an hour on eight.
          printf '[reviewer]\nmodel = "%s"\n\n[run]\nchecklist_dir = "checklists/grouped"\n' \
            "$MODEL" > .roboviewer/config.toml

      # No --fail-on: a finding here is to read, not to block a merge. The
      # target branch comes from GITHUB_BASE_REF, as it does in a user's job.
      - name: review
        run: |
          code=0
          roboviewer review --config .roboviewer/config.toml || code=$?
          # 3 is "an item failed and its aspect went unreviewed": the run is on
          # disk and worth posting. 2 is the tool not having run at all.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
        env:
          ROBOVIEWER_PROVIDER_CONFIG: .roboviewer/provider.toml
          ROBOVIEWER_API_KEY: ${{ secrets.ROBOVIEWER_API_KEY }}

      - name: comment
        run: roboviewer comment --config .roboviewer/config.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No artifact of the run: it names the model, and an artifact of a public
      # repository is downloadable by anyone.
