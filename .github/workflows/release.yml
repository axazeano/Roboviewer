name: Release

# Publishing is a tag push, not a merge: main moves on its own, and a release
# is the moment somebody decides a commit on it is the one to ship.
on:
  push:
    tags: ["Release/*"]  # the form the one tag in this repository already uses

permissions:
  contents: read

jobs:
  # CI runs on pushes to main and on pull requests, neither of which a tag push
  # is, so nothing else here would have run the suite against the commit being
  # released. Lint and typing stay in CI: they judge the source, and the source
  # is the one that was already merged.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the minimum requires-python promises
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The version lives in pyproject.toml and the tag is written by hand, so
      # the two drift. PyPI rejects a filename it already has and accepts
      # anything else, which makes a mistyped tag a wrong release rather than a
      # failure — this is the only place that comparison still costs nothing.
      - name: tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#Release/}"
          packaged=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME ships version $packaged" >&2
            exit 1
          fi

      - name: build
        run: |
          pip install build==1.3.0
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Needs the build for its tag-versus-version check. Docker Hub has no trusted
  # publishing, so this job reads a stored credential.
  image:
    needs: build
    runs-on: ubuntu-latest
    environment: dockerhub  # holds the credential, and can gate on a reviewer
    steps:
      - uses: actions/checkout@v4

      - name: what the tag ships
        id: version
        run: echo "number=${GITHUB_REF_NAME#Release/}" >> "$GITHUB_OUTPUT"

      # arm64 is emulated on the amd64 runner: slow, but runs on Apple Silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/roboviewer:${{ steps.version.outputs.number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/roboviewer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Split from the build so the job that holds the publishing identity runs
  # nothing but the upload: it checks out no code and installs no dependencies,
  # and the artifact it uploads is the one the build job already produced.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # what PyPI trusts instead of an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
