# The hand-established truth for one merge request.
#
# Format: [[expected]] — a defect the review has to find; [[forbidden]] — a
# claim the review produced and that was checked and proven false. Both halves
# are needed: without forbidden, high recall can be bought with noise.
#
# How the truth is established: every entry was checked against the code at the
# named commit and carries in `evidence` exactly what it was checked with. An
# entry without evidence is an opinion, not truth — those do not go in here.

[meta]
repo = "next-cloude-ios"
url = "https://github.com/nextcloud/ios/pull/4091"
branch = "nmc/albums_customisation"
target = "master"
base = "3fe3a8d1432c"
head = "826f10c7ac32"
language = "Swift"
domain = "iOS client of a cloud storage"
files = 32
added = 3816
removed = 87
established = "2026-08-04"    # entries 1-16, manual review
extended = "2026-08-20"       # entries 17-31, from muse-glimmer's output, verified
extended_2 = "2026-08-21"     # entry 32, from the muse-3-low-nobuild series
note = """
Careful when comparing models: entries 1-16 were collected independently of
any run, entries 17-32 come from muse-glimmer's output verified against the
code. The model that produced half of the truth set has an advantage on it; an
honest comparison of models uses entries 1-16 only (`origin = "manual"`).
"""

